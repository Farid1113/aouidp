[package]
name = "digital_core"
version = "0.3.0"
edition = "2021"
description = "Native digital code validation and keyed fingerprints for Digital Store Pro"

[lib]
name = "digital_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
